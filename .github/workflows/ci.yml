name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: pytest (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
    env:
      # 本机习惯 -X utf8 救不了 CI 里的 python -m pytest：这里是唯一能覆盖全部步骤的开关。
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # 脱敏审计器第 4 步是**全历史**扫描：浅克隆（默认 fetch-depth: 1）下只见 1 个提交
          # → 历史面无法成立（审计器会以 exit 2 明确报"浅克隆"而非静默空扫）。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (same extras set as README)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test suite
        run: python -m pytest -q

      - name: Desensitization audit (4-step + artifact scan)
        run: python tools/audit_desensitize.py

      - name: Synthetic artifacts are byte-identical (--check)
        run: python tools/gen_synthetic_logs.py --check

      - name: Truth benchmark reconciles against implanted truth (exit 0)
        shell: bash
        run: |
          set +e
          python -m opslens bench
          code=$?
          test "$code" = "0" || { echo "expected exit 0, got $code"; exit 1; }

      - name: Truth benchmark unknown suite -> exit 2
        shell: bash
        run: |
          set +e
          python -m opslens bench --only NOPE
          code=$?
          test "$code" = "2" || { echo "expected exit 2, got $code"; exit 1; }

      - name: Milestone-close double baseline rerun (parse F1 + e2e)
        run: python -m opslens bench --check

      - name: Smoke via module form
        run: python -m opslens --help

      - name: Smoke via console script (different sys.path path)
        run: opslens --help

      - name: Smoke exit-code contract (rules missing -> 4)
        shell: bash
        run: |
          set +e
          python -m opslens scan --home . --rules-dir ./no-such-rules
          code=$?
          test "$code" = "4" || { echo "expected exit 4, got $code"; exit 1; }

      - name: Smoke scan on synthetic data (writes IR, exit 0)
        shell: bash
        run: |
          set +e
          python -m opslens scan --home data/synthetic --out ci-events.json
          code=$?
          test "$code" = "0" || { echo "expected exit 0, got $code"; exit 1; }
          test -f ci-events.json || { echo "events file not written"; exit 1; }

      - name: Smoke unknown schema version -> exit 4
        shell: bash
        run: |
          set -e
          mkdir -p ci-future/.claude/projects/p
          printf '%s\n' '{"type":"system","version":"9.9.999","session_id":"s"}' > ci-future/.claude/projects/p/s.jsonl
          set +e
          python -m opslens scan --home ci-future --rules-dir data/rules 2> ci-future-err.txt
          code=$?
          set -e
          test "$code" = "4" || { echo "expected exit 4, got $code"; exit 1; }
          grep -q "9.9.999" ci-future-err.txt || { echo "error message must name the unknown version"; exit 1; }

      - name: Smoke report on synthetic data (writes MD/HTML/JSON, exit 1 = findings)
        shell: bash
        run: |
          set +e
          python -m opslens report --events ci-events.json --out ci-report
          code=$?
          test "$code" = "1" || { echo "expected exit 1 (findings), got $code"; exit 1; }
          test -f ci-report/report.json || { echo "report.json not written"; exit 1; }
          test -f ci-report/report.md || { echo "report.md not written"; exit 1; }
          test -f ci-report/report.html || { echo "report.html not written"; exit 1; }
          # 零外链硬门（断网可开）：产物不得含任何外部资源引用
          ! grep -qE "https?://|<link|<script|<img|@import" ci-report/report.html || { echo "report.html contains external resources"; exit 1; }
          ! grep -qE "https?://" ci-report/report.md || { echo "report.md contains external links"; exit 1; }

      - name: Committed example report is byte-identical on regeneration
        shell: bash
        run: |
          # examples/ 只入仓三份报告产物；事件流是中间件，由合成数据在 CI 内重建
          python -m opslens scan --home data/synthetic --out ci-example-events.json
          # report 检出"建议移除"时按契约退出码 1（不是跑挂）——不能用 set -e 直接串，
          # 须显式断言退出码后再比对产物（首跑实测：set -e 会在 report 处提前中断，cmp 从未执行）
          set +e
          python -m opslens report --events ci-example-events.json --out ci-example-report
          code=$?
          set -e
          test "$code" = "1" || { echo "expected exit 1 (findings), got $code"; exit 1; }
          cmp ci-example-report/report.md examples/report.md || { echo "examples/report.md drifted"; exit 1; }
          cmp ci-example-report/report.html examples/report.html || { echo "examples/report.html drifted"; exit 1; }
          cmp ci-example-report/report.json examples/report.json || { echo "examples/report.json drifted"; exit 1; }
