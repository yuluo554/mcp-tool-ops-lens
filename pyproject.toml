[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tool-ops-lens"
description = "MCP/工具调用失败率与上下文开销归因 CLI（纯本地、零上传、零第三方依赖）"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = ["mcp", "claude-code", "codex", "observability", "attribution"]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
opslens = "opslens.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "opslens.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
